name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run CI checks
        run: pnpm ci:check
      - name: Install browser for layout regression
        run: pnpm exec playwright install --with-deps chromium
      - name: Check interactive browser layout
        run: pnpm test:browser
      - name: Save browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-layout-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
